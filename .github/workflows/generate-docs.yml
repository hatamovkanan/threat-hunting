name: Generate Docs from TOML

on:
  push:
    branches:
      - main
    paths:
      - '**/queries/*.toml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate markdown docs
        run: python .github/scripts/toml_to_md.py

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/docs/*.md'
          git diff --staged --quiet || git commit -m "docs: auto-generate markdown from TOML [skip ci]"
          git push
