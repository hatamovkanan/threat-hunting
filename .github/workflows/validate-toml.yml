name: Validate Hunt TOML

on:
  pull_request:
    paths:
      - '**/queries/*.toml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate TOML files
        run: python .github/scripts/validate_hunt.py
